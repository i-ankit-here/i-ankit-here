<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0a1022" />
      <stop offset="80%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Fiber Arcs Gradient -->
    <linearGradient id="fiberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fiberPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.7)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.5)); }
      50% { filter: drop-shadow(0 0 22px rgba(0, 242, 254, 0.9)) drop-shadow(0 0 40px rgba(236, 72, 153, 0.7)); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes sweepLine {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
    .neon-title {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 3s ease-in-out infinite;
    }
    .fiber {
      stroke-dasharray: 400;
      animation: sweepLine 8s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="350" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="100" y1="0" x2="100" y2="350" />
    <line x1="250" y1="0" x2="250" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="550" y1="0" x2="550" y2="350" />
    <line x1="700" y1="0" x2="700" y2="350" />
    <line x1="850" y1="0" x2="850" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
    <line x1="1150" y1="0" x2="1150" y2="350" />
  </g>

  <!-- Fiber Optics / Curved Neon Wave Arcs -->
  <g opacity="0.45">
    <path d="M-50,220 C200,280 350,140 600,160 C850,180 950,90 1250,70" fill="none" stroke="url(#fiberCyan)" stroke-width="2.5" class="fiber" />
    <path d="M-50,140 C150,90 400,260 700,180 C950,100 1100,230 1250,180" fill="none" stroke="url(#fiberPurple)" stroke-width="2" class="fiber" style="animation-delay: -3s;" />
    <path d="M-50,260 C250,180 500,290 800,120 C1000,50 1150,120 1250,90" fill="none" stroke="url(#fiberCyan)" stroke-width="1.5" class="fiber" style="animation-delay: -5s;" />
  </g>

  <!-- Left Glowing Starburst Particle Accents -->
  <g class="particle">
    <circle cx="160" cy="80" r="2" fill="#00f2fe" opacity="0.8" />
    <circle cx="280" cy="50" r="1.5" fill="#a855f7" opacity="0.7" />
    <circle cx="390" cy="95" r="2.5" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)" />
    <circle cx="520" cy="65" r="1.5" fill="#f43f5e" opacity="0.6" />
    <circle cx="680" cy="110" r="2" fill="#00f2fe" opacity="0.7" />
  </g>

  <!-- Constellation Nodes (Left Side Network) -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.25">
    <line x1="120" y1="120" x2="160" y2="80" />
    <line x1="160" y1="80" x2="240" y2="105" />
    <line x1="240" y1="105" x2="280" y2="50" />
    <line x1="280" y1="50" x2="350" y2="70" />
    <line x1="120" y1="120" x2="190" y2="160" />
    <line x1="190" y1="160" x2="270" y2="175" />
  </g>

  <!-- Star Emblem Beside Name -->
  <g transform="translate(190, 85)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#starGlow)" opacity="0.4" />
    <path d="M20,6 L24,16 L34,20 L24,24 L20,34 L16,24 L6,20 L16,16 Z" fill="#fef08a" />
    <circle cx="20" cy="20" r="3" fill="#ffffff" />
    <!-- Orbiting Ring -->
    <ellipse cx="20" cy="20" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" transform="rotate(-25, 20, 20)" />
  </g>

  <!-- Main Hero Name -->
  <text x="245" y="125" font-size="64" fill="url(#textGrad)" class="neon-title">ANKIT MEENA</text>

  <!-- Subtitle Text -->
  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    Subtitle: Student (B. Tech CSE-27) at Dr B R Ambedkar National Institute Of Technology, Jalandhar
  </text>

  <!-- Cyberpunk Glowing Pill Badge -->
  <g transform="translate(410, 200)" filter="url(#softGlow)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="380" height="42" rx="8" fill="#031526" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.8" />
    
    <!-- Neon Corner Accent Brackets -->
    <path d="M-3,10 L-3,-3 L10,-3" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M370,-3 L383,-3 L383,10" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M-3,32 L-3,45 L10,45" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M370,45 L383,45 L383,32" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    
    <!-- Pill Text -->
    <text x="190" y="26" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      Full-Stack Developer  •  Tech Explorer  •  OSS
    </text>
  </g>

  <!-- Floating Dark IDE Window on Right -->
  <g transform="translate(930, 45)" filter="url(#softGlow)">
    <!-- Window Body -->
    <rect x="0" y="0" width="235" height="150" rx="7" fill="#0d1424" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Header -->
    <path d="M0,7 Q0,0 7,0 L228,0 Q235,0 235,7 L235,22 L0,22 Z" fill="#0a0f1d" />
    
    <!-- macOS Window Control Dots -->
    <circle cx="12" cy="11" r="3.5" fill="#ef4444" />
    <circle cx="23" cy="11" r="3.5" fill="#f59e0b" />
    <circle cx="34" cy="11" r="3.5" fill="#10b981" />
    <text x="125" y="15" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#64748b">core_profile.cpp</text>

    <!-- Code Syntax Highlighting -->
    <g font-family="'Courier New', monospace" font-size="9.5" font-weight="600">
      <text x="12" y="42" fill="#ec4899">struct <tspan fill="#38bdf8">Developer</tspan> {</text>
      <text x="22" y="58" fill="#94a3b8">string name = <tspan fill="#a3e635">"Ankit"</tspan>;</text>
      <text x="22" y="74" fill="#94a3b8">string dept = <tspan fill="#a3e635">"CSE-27"</tspan>;</text>
      <text x="22" y="90" fill="#94a3b8">string inst = <tspan fill="#a3e635">"NIT Jalandhar"</tspan>;</text>
      <text x="22" y="106" fill="#38bdf8">bool <tspan fill="#facc15">open_to_work</tspan> = <tspan fill="#ec4899">true</tspan>;</text>
      <text x="12" y="122" fill="#ec4899">};</text>
      <text x="12" y="138" fill="#38bdf8">Developer <tspan fill="#f8fafc">ankit</tspan>; <tspan fill="#64748b">// Ready</tspan></text>
    </g>
  </g>

  <!-- Bottom Cyber Decorative Border Strip -->
  <line x1="60" y1="330" x2="1140" y2="330" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
  <line x1="500" y1="330" x2="700" y2="330" stroke="#00f2fe" stroke-width="2.5" filter="url(#softGlow)" />
  <circle cx="500" cy="330" r="3" fill="#00f2fe" />
  <circle cx="700" cy="330" r="3" fill="#00f2fe" />
</svg>
