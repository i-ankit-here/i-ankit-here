<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="35%" stop-color="#090f22" />
      <stop offset="70%" stop-color="#0d1428" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Glowing Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Fiber Arcs Gradient -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="45%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.7)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.95)) drop-shadow(0 0 35px rgba(244, 63, 94, 0.75)); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-7px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.4; }
    }
    .neon-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .particle { animation: floatParticle 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1560" height="380" fill="url(#bgGrad)" />

  <!-- Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1560" y2="60" />
    <line x1="0" y1="120" x2="1560" y2="120" />
    <line x1="0" y1="180" x2="1560" y2="180" />
    <line x1="0" y1="240" x2="1560" y2="240" />
    <line x1="0" y1="300" x2="1560" y2="300" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="280" y1="0" x2="280" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="760" y1="0" x2="760" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
    <line x1="1240" y1="0" x2="1240" y2="380" />
    <line x1="1400" y1="0" x2="1400" y2="380" />
  </g>

  <!-- Neon Laser Light Waves Across Banner -->
  <g opacity="0.5">
    <path d="M-50,240 C220,300 450,150 780,170 C1080,190 1280,90 1600,70" fill="none" stroke="url(#laserCyan)" stroke-width="2.5" />
    <path d="M-50,150 C200,90 520,270 880,190 C1180,110 1360,240 1600,190" fill="none" stroke="url(#laserMagenta)" stroke-width="2" />
    <path d="M-50,280 C320,200 640,310 1020,130 C1260,60 1420,130 1600,100" fill="none" stroke="url(#laserCyan)" stroke-width="1.5" />
  </g>

  <!-- Constellation Nodes & Particles -->
  <g class="particle">
    <circle cx="160" cy="90" r="2.5" fill="#00f2fe" filter="url(#boxGlow)" />
    <circle cx="280" cy="60" r="2" fill="#a855f7" />
    <circle cx="440" cy="110" r="3" fill="#38bdf8" filter="url(#boxGlow)" />
    <circle cx="820" cy="75" r="2" fill="#f43f5e" />
    <circle cx="1080" cy="120" r="2.5" fill="#00f2fe" />
    <line x1="160" y1="90" x2="280" y2="60" stroke="#00f2fe" stroke-width="0.7" opacity="0.3" />
    <line x1="280" y1="60" x2="440" y2="110" stroke="#38bdf8" stroke-width="0.7" opacity="0.25" />
  </g>

  <!-- ==================== CENTER HERO CONTENT (X: 200 to 1100) ==================== -->
  
  <!-- Star Emblem Beside Name -->
  <g transform="translate(245, 95)" filter="url(#boxGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#starGlow)" opacity="0.5" />
    <path d="M20,4 L24,15 L36,20 L24,25 L20,36 L16,25 L4,20 L16,15 Z" fill="#fef08a" />
    <circle cx="20" cy="20" r="3.5" fill="#ffffff" />
    <!-- Orbiting Cyan Ring -->
    <ellipse cx="20" cy="20" rx="24" ry="9" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.8" transform="rotate(-25, 20, 20)" />
  </g>

  <!-- Main Hero Name -->
  <g transform="translate(305, 135)">
    <!-- 3D Neon Back Shadow -->
    <text x="3" y="3" font-size="68" fill="#1e1035" class="neon-title" opacity="0.8">ANKIT MEENA</text>
    <!-- Foreground Glowing Text with Cyan Stroke -->
    <text x="0" y="0" font-size="68" fill="url(#textGrad)" stroke="#00f2fe" stroke-width="1.2" class="neon-title">ANKIT MEENA</text>
  </g>

  <!-- Subtitle Text (No "Subtitle:" word, Cleanly Centered) -->
  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Student (B. Tech CSE-27) at Dr B R Ambedkar National Institute Of Technology, Jalandhar
  </text>

  <!-- Cyberpunk Glowing Pill Badge (Software Engineer) -->
  <g transform="translate(400, 215)" filter="url(#boxGlow)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="400" height="44" rx="8" fill="#021424" fill-opacity="0.85" stroke="#00f2fe" stroke-width="1.8" />
    
    <!-- Neon Corner Accent Brackets -->
    <path d="M-3,10 L-3,-3 L10,-3" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M390,-3 L403,-3 L403,10" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M-3,34 L-3,47 L10,47" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M390,47 L403,47 L403,34" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    
    <!-- Pill Text: Software Engineer -->
    <text x="200" y="27" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      Software Engineer  •  Tech Explorer  •  OSS
    </text>
  </g>

  <!-- ==================== FLOATING CODE WINDOW ON FAR RIGHT (X: 1220) ==================== -->
  <g transform="translate(1220, 50)" filter="url(#boxGlow)">
    <!-- Window Body -->
    <rect x="0" y="0" width="300" height="195" rx="8" fill="#0b1220" fill-opacity="0.95" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Header -->
    <path d="M0,8 Q0,0 8,0 L292,0 Q300,0 300,8 L300,26 L0,26 Z" fill="#070c16" />
    
    <!-- macOS Control Dots -->
    <circle cx="14" cy="13" r="4" fill="#ef4444" />
    <circle cx="27" cy="13" r="4" fill="#f59e0b" />
    <circle cx="40" cy="13" r="4" fill="#10b981" />
    <text x="160" y="17" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" fill="#64748b">engineer.cpp</text>

    <!-- Clean Software Engineering Code (No open to work) -->
    <g font-family="'Consolas', monospace" font-size="10" font-weight="600">
      <text x="14" y="50" fill="#ec4899">struct <tspan fill="#38bdf8">SoftwareEngineer</tspan> {</text>
      <text x="26" y="70" fill="#94a3b8">name: <tspan fill="#a3e635">"ANKIT MEENA"</tspan>;</text>
      <text x="26" y="90" fill="#94a3b8">degree: <tspan fill="#a3e635">"B. Tech CSE-27"</tspan>;</text>
      <text x="26" y="110" fill="#94a3b8">institute:</text>
      <text x="36" y="128" fill="#38bdf8">"NIT Jalandhar"</text>
      <text x="26" y="148" fill="#94a3b8">focus: <tspan fill="#facc15">"C++, DSA, Web &amp; AI"</tspan>;</text>
      <text x="14" y="170" fill="#ec4899">};</text>
    </g>
  </g>

  <!-- Bottom Cyber Divider Strip -->
  <line x1="80" y1="355" x2="1480" y2="355" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
  <line x1="600" y1="355" x2="960" y2="355" stroke="#00f2fe" stroke-width="2.5" filter="url(#boxGlow)" />
  <circle cx="600" cy="355" r="3" fill="#00f2fe" />
  <circle cx="960" cy="355" r="3" fill="#00f2fe" />
</svg>
