    </g>

    <!-- Bar 5: Repos (8%) -->
    <g transform="translate(0, 116)">
      <circle cx="10" cy="8" r="6" fill="#16a34a" opacity="0.3" />
      <circle cx="10" cy="8" r="3" fill="#22c55e" />
      <rect x="30" y="3" width="180" height="10" rx="5" fill="#0f172a" />
      <rect x="30" y="3" width="16" height="10" rx="5" fill="#22c55e" filter="url(#neonGlow)" />
      <text x="225" y="12" class="mono" font-size="11" fill="#cbd5e1">8%</text>
    </g>
  </g>
</svg>
