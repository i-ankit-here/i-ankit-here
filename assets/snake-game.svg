      <circle cx="10" cy="8" r="3" fill="#38bdf8" />
      <rect x="30" y="3" width="180" height="10" rx="5" fill="#0f172a" />
      <rect x="30" y="3" width="122" height="10" rx="5" fill="#00f2fe" filter="url(#neonGlow)" />
      <text x="225" y="12" class="mono" font-size="11" fill="#cbd5e1">68%</text>
    </g>

    <!-- Bar 2: Pull Requests (33%) -->
    <g transform="translate(0, 44)">
      <circle cx="10" cy="8" r="6" fill="#7c3aed" opacity="0.3" />
      <circle cx="10" cy="8" r="3" fill="#a855f7" />
      <rect x="30" y="3" width="180" height="10" rx="5" fill="#0f172a" />
      <rect x="30" y="3" width="60" height="10" rx="5" fill="#a855f7" filter="url(#neonGlow)" />
      <text x="225" y="12" class="mono" font-size="11" fill="#cbd5e1">33%</text>
    </g>

    <!-- Bar 3: Code Reviews (42%) -->
    <g transform="translate(0, 68)">
      <circle cx="10" cy="8" r="6" fill="#db2777" opacity="0.3" />
      <circle cx="10" cy="8" r="3" fill="#ec4899" />
      <rect x="30" y="3" width="180" height="10" rx="5" fill="#0f172a" />
      <rect x="30" y="3" width="76" height="10" rx="5" fill="#ec4899" filter="url(#neonGlow)" />
      <text x="225" y="12" class="mono" font-size="11" fill="#cbd5e1">42%</text>
    </g>

    <!-- Bar 4: Issues (28%) -->
    <g transform="translate(0, 92)">
      <circle cx="10" cy="8" r="6" fill="#d97706" opacity="0.3" />
      <circle cx="10" cy="8" r="3" fill="#f59e0b" />
      <rect x="30" y="3" width="180" height="10" rx="5" fill="#0f172a" />
      <rect x="30" y="3" width="50" height="10" rx="5" fill="#f59e0b" filter="url(#neonGlow)" />
