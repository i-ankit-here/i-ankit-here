<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 630" width="100%" height="100%">
  <defs>
    <!-- Card Background -->
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Glowing Snake Head -->
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Radar Chart Fill -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="snakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseSnake {
      0%, 100% { filter: drop-shadow(0 0 8px #00f2fe) drop-shadow(0 0 16px #4ade80); }
      50% { filter: drop-shadow(0 0 16px #38bdf8) drop-shadow(0 0 24px #22c55e); }
    }
    @keyframes particleSpark {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes hudBorderGlow {
      0%, 100% { stroke: #00f2fe; filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.6)); }
      50% { stroke: #38bdf8; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8)); }
    }
    .hud-frame { animation: hudBorderGlow 4s ease-in-out infinite; }
    .snake-body { animation: pulseSnake 3s ease-in-out infinite; }
    .spark { animation: particleSpark 2s ease-in-out infinite; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
  </style>

  <!-- Outer HUD Container Frame -->
  <g class="hud-frame" filter="url(#neonGlow)">
    <path d="M 25,12 L 625,12 A 12,12 0 0,1 637,24 L 637,606 A 12,12 0 0,1 625,618 L 25,618 A 12,12 0 0,1 13,606 L 13,24 A 12,12 0 0,1 25,12 Z" 
          fill="url(#gameBg)" stroke="#00f2fe" stroke-width="2" />
    <!-- Tech Corner Accents -->
    <path d="M 8,35 L 8,8 L 35,8" fill="none" stroke="#00f2fe" stroke-width="2.8" />
    <path d="M 615,8 L 642,8 L 642,35" fill="none" stroke="#00f2fe" stroke-width="2.8" />
    <path d="M 8,595 L 8,622 L 35,622" fill="none" stroke="#00f2fe" stroke-width="2.8" />
    <path d="M 615,622 L 642,622 L 642,595" fill="none" stroke="#00f2fe" stroke-width="2.8" />
  </g>

  <!-- Arcade Top Header Bar -->
  <g transform="translate(35, 42)">
    <text x="0" y="0" class="mono" font-size="16" fill="#38bdf8" letter-spacing="2">LEVEL  01</text>
    <text x="580" y="0" text-anchor="end" class="mono" font-size="16" fill="#38bdf8" letter-spacing="1">
      SCORE: <tspan fill="#f8fafc">13,370</tspan>
      <tspan fill="#4ade80" font-size="14" dx="12">+10 commits</tspan>
    </text>
  </g>

  <!-- Floating Background Code Snippets (Aesthetic overlay) -->
  <g opacity="0.12" font-family="'Consolas', monospace" font-size="8.5" fill="#38bdf8">
    <text x="35" y="440">void updateSnake(int x, int y) {</text>
    <text x="45" y="455">  grid[x][y].active = true;</text>
    <text x="45" y="470">  snake.grow(COMMIT_MULT);</text>
    <text x="35" y="485">}</text>
  </g>
  <g opacity="0.12" font-family="'Consolas', monospace" font-size="8.5" fill="#38bdf8" text-anchor="end">
    <text x="615" y="440">// System Buffer</text>
    <text x="615" y="455">commit_stream: 0x8F32C</text>
    <text x="615" y="470">streak_status: ACTIVE</text>
    <text x="615" y="485">runtime: NOMINAL</text>
  </g>

  <!-- ==================== 3D ISOMETRIC CONTRIBUTION GRID ==================== -->
  <!-- Center: X=325, Y=140 -->
  <g transform="translate(325, 80)">
    <!-- 3D Isometric Base Shadow / Slab -->
    <polygon points="0,90 220,200 0,310 -220,200" fill="#040711" opacity="0.8" />
    <!-- 3D Slab Thickness -->
    <polygon points="-220,200 0,310 0,332 -220,222" fill="#0b172a" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <polygon points="0,310 220,200 220,222 0,332" fill="#07101e" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Isometric Matrix Rendering (9x9 Tiles) -->
    <!-- Tile Dimensions: W=38, H=19. Step: dx=19, dy=9.5 -->
    <!-- ROW 0 -->
    <g transform="translate(0, 100)">
      <!-- Row 0 -->
      <polygon points="0,0 18,9 0,18 -18,9" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="19,9.5 37,18.5 19,27.5 1,18.5" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="38,19 56,28 38,37 20,28" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="57,28.5 75,37.5 57,46.5 39,37.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="76,38 94,47 76,56 58,47" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="95,47.5 113,56.5 95,65.5 77,56.5" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="114,57 132,66 114,75 96,66" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="133,66.5 151,75.5 133,84.5 115,75.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 1 -->
      <polygon points="-19,9.5 -1,18.5 -19,27.5 -37,18.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="0,19 18,28 0,37 -18,28" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="19,28.5 37,37.5 19,46.5 1,37.5" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="38,38 56,47 38,56 20,47" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="57,47.5 75,56.5 57,65.5 39,56.5" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="76,57 94,66 76,75 58,66" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="95,66.5 113,75.5 95,84.5 77,75.5" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="114,76 132,85 114,94 96,85" fill="#006d32" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 2 -->
      <polygon points="-38,19 -20,28 -38,37 -56,28" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-19,28.5 -1,37.5 -19,46.5 -37,37.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="0,38 18,47 0,56 -18,47" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="19,47.5 37,56.5 19,65.5 1,56.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="38,57 56,66 38,75 20,66" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="57,66.5 75,75.5 57,84.5 39,75.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="76,76 94,85 76,94 58,85" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="95,85.5 113,94.5 95,103.5 77,94.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 3 -->
      <polygon points="-57,28.5 -39,37.5 -57,46.5 -75,37.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-38,38 -20,47 -38,56 -56,47" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-19,47.5 -1,56.5 -19,65.5 -37,56.5" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="0,57 18,66 0,75 -18,66" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="19,66.5 37,75.5 19,84.5 1,75.5" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="38,76 56,85 38,94 20,85" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="57,85.5 75,94.5 57,103.5 39,94.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="76,95 94,104 76,113 58,104" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 4 -->
      <polygon points="-76,38 -58,47 -76,56 -94,47" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-57,47.5 -39,56.5 -57,65.5 -75,56.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-38,57 -20,66 -38,75 -56,66" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="-19,66.5 -1,75.5 -19,84.5 -37,75.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="0,76 18,85 0,94 -18,85" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="19,85.5 37,94.5 19,103.5 1,94.5" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="38,95 56,104 38,113 20,104" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="57,104.5 75,113.5 57,122.5 39,113.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 5 -->
      <polygon points="-95,47.5 -77,56.5 -95,65.5 -113,56.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-76,57 -58,66 -76,75 -94,66" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-57,66.5 -39,75.5 -57,84.5 -75,75.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-38,76 -20,85 -38,94 -56,85" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-19,85.5 -1,94.5 -19,103.5 -37,94.5" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="0,95 18,104 0,113 -18,104" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="19,104.5 37,113.5 19,122.5 1,113.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="38,114 56,123 38,132 20,123" fill="#006d32" stroke="#13233a" stroke-width="0.6" />

      <!-- Row 6 -->
      <polygon points="-114,57 -96,66 -114,75 -132,66" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-95,66.5 -77,75.5 -95,84.5 -113,75.5" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="-76,76 -58,85 -76,94 -94,85" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-57,85.5 -39,94.5 -57,103.5 -75,94.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-38,95 -20,104 -38,113 -56,104" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-19,104.5 -1,113.5 -19,122.5 -37,113.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="0,114 18,123 0,132 -18,123" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="19,123.5 37,132.5 19,141.5 1,132.5" fill="#00f2fe" filter="url(#neonGlow)" />

      <!-- Row 7 -->
      <polygon points="-133,66.5 -115,75.5 -133,84.5 -151,75.5" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-114,76 -96,85 -114,94 -132,85" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-95,85.5 -77,94.5 -95,103.5 -113,94.5" fill="#26a641" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-76,95 -58,104 -76,113 -94,104" fill="#00f2fe" filter="url(#neonGlow)" />
      <polygon points="-57,104.5 -39,113.5 -57,122.5 -75,113.5" fill="#39d353" filter="url(#neonGlow)" />
      <polygon points="-38,114 -20,123 -38,132 -56,123" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
      <polygon points="-19,123.5 -1,132.5 -19,141.5 -37,132.5" fill="#006d32" stroke="#13233a" stroke-width="0.6" />
      <polygon points="0,133 18,142 0,151 -18,142" fill="#0e1726" stroke="#13233a" stroke-width="0.6" />
    </g>

    <!-- Glowing Electric Snake Crawling Over Grid -->
    <g class="snake-body" filter="url(#snakeGlow)">
      <!-- Snake Path with Glow Trail -->
      <path d="M-80,180 C-40,165 0,150 40,120 C60,105 80,85 50,70 C20,55 -10,75 -35,95 C-55,110 -20,135 15,120" 
            fill="none" stroke="url(#snakeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-80,180 C-40,165 0,150 40,120 C60,105 80,85 50,70 C20,55 -10,75 -35,95 C-55,110 -20,135 15,120" 
            fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Snake Head -->
      <circle cx="15" cy="120" r="7" fill="#00f2fe" />
      <circle cx="15" cy="120" r="4" fill="#ffffff" />
      <circle cx="17" cy="118" r="1.5" fill="#000" />
      <circle cx="13" cy="118" r="1.5" fill="#000" />
    </g>

    <!-- Glowing Particles / Energy Sparks behind snake -->
    <g class="spark">
      <circle cx="35" cy="95" r="3" fill="#4ade80" filter="url(#neonGlow)" />
      <circle cx="60" cy="110" r="2.5" fill="#00f2fe" filter="url(#neonGlow)" />
      <circle cx="-10" cy="85" r="2" fill="#38bdf8" />
      <circle cx="-50" cy="140" r="3" fill="#22c55e" filter="url(#neonGlow)" />
      <circle cx="-70" cy="170" r="2" fill="#00f2fe" />
      <circle cx="70" cy="80" r="2" fill="#facc15" />
    </g>
  </g>

  <!-- ==================== BOTTOM HUD: RADAR CHART & ACTIVITY BARS ==================== -->
  <line x1="35" y1="420" x2="615" y2="420" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Left: Mini Radar / Spider Web Chart ("GitHub Stats") -->
  <g transform="translate(145, 520)">
    <text x="0" y="-85" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">GitHub Stats</text>
    
    <!-- Radar Axis Rings -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#1e293b" stroke-width="1" />
    
    <!-- Axis Lines -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#334155" stroke-width="1" />
    <line x1="-52" y1="-30" x2="52" y2="30" stroke="#334155" stroke-width="1" />
    <line x1="-52" y1="30" x2="52" y2="-30" stroke="#334155" stroke-width="1" />

    <!-- Cardinal Labels -->
    <text x="0" y="-68" text-anchor="middle" class="mono" font-size="9" fill="#64748b">NW</text>
    <text x="62" y="-28" text-anchor="middle" class="mono" font-size="9" fill="#64748b">NE</text>
    <text x="62" y="38" text-anchor="middle" class="mono" font-size="9" fill="#64748b">SE</text>
    <text x="-62" y="38" text-anchor="middle" class="mono" font-size="9" fill="#64748b">SW</text>

    <!-- Radar Data Polygon (Glowing Filled Shape) -->
    <polygon points="0,-48 44,-18 30,22 0,42 -40,15 -25,-22" fill="url(#radarGrad)" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)" />
    <!-- Data Points -->
    <circle cx="0" cy="-48" r="3" fill="#00f2fe" />
    <circle cx="44" cy="-18" r="3" fill="#38bdf8" />
    <circle cx="30" cy="22" r="3" fill="#a855f7" />
    <circle cx="0" cy="42" r="3" fill="#ec4899" />
    <circle cx="-40" cy="15" r="3" fill="#00f2fe" />
    <circle cx="-25" cy="-22" r="3" fill="#38bdf8" />
  </g>

  <!-- Right: Activity Progress Bars -->
  <g transform="translate(350, 440)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">Activity</text>
    
    <!-- Bar 1: Commits (68%) -->
    <g transform="translate(0, 20)">
