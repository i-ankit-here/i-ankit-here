<svg xmlns="http://www.w3.org/2000/svg" width="168" height="28" role="img" aria-label="PROFILE VIEWS: ACTIVE">
  <title>PROFILE VIEWS</title>
  <defs>
    <linearGradient id="viewsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <rect width="112" height="28" fill="#0d1117"/>
    <rect x="112" width="56" height="28" fill="url(#viewsGrad)"/>
    <line x1="0" y1="0" x2="168" y2="0" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <line x1="0" y1="28" x2="168" y2="28" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
  </g>
  <!-- Pulsing Radar Dot -->
  <circle cx="14" cy="14" r="3.5" fill="#00f2fe">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="14" cy="14" r="6" fill="none" stroke="#00f2fe" stroke-width="1">
    <animate attributeName="r" values="3.5;7.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <g fill="#fff" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Verdana, sans-serif" font-size="10" letter-spacing="1">
    <text x="63" y="17.5" fill="#e2e8f0" font-weight="600">PROFILE VIEWS</text>
    <text x="140" y="17.5" fill="#050914" font-weight="800">ACTIVE</text>
  </g>
</svg>
