<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="100%" height="100%">
  <defs>
    <!-- Card Background -->
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0c1326" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Glowing Radar Fill -->
    <linearGradient id="statRadarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Starburst Gradient -->
    <linearGradient id="starburstGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="statsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes hudBorderPulse {
      0%, 100% { stroke: #00f2fe; filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.6)); }
      50% { stroke: #38bdf8; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9)); }
    }
    @keyframes barDance {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.7); }
    }
    .hud-box { animation: hudBorderPulse 4s ease-in-out infinite; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    .label-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .val-txt { font-family: 'Consolas', monospace; font-size: 12px; font-weight: 700; fill: #38bdf8; }
  </style>

  <!-- Cyber HUD Outer Container -->
  <g class="hud-box" filter="url(#statsGlow)">
    <path d="M 25,12 L 675,12 A 12,12 0 0,1 687,24 L 687,246 A 12,12 0 0,1 675,258 L 25,258 A 12,12 0 0,1 13,246 L 13,24 A 12,12 0 0,1 25,12 Z" 
          fill="url(#statsBg)" stroke="#00f2fe" stroke-width="2.2" />

    <!-- Tech Corner Accents -->
    <path d="M 8,32 L 8,8 L 32,8" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 668,8 L 692,8 L 692,32" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 8,238 L 8,262 L 32,262" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 668,262 L 692,262 L 692,238" fill="none" stroke="#00f2fe" stroke-width="3" />
  </g>

  <!-- ==================== LEFT: RADAR CHART ==================== -->
  <g transform="translate(115, 125)">
    <!-- Concentric Web Rings -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="none" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="0,-25 21,-12 21,12 0,25 -21,12 -21,-12" fill="none" stroke="#1e293b" stroke-width="1" />
    
    <!-- Axes -->
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#334155" stroke-width="1" />
    <line x1="-56" y1="-32" x2="56" y2="32" stroke="#334155" stroke-width="1" />
    <line x1="-56" y1="32" x2="56" y2="-32" stroke="#334155" stroke-width="1" />

    <!-- Cardinal Marks -->
    <text x="0" y="-72" text-anchor="middle" class="mono" font-size="9" fill="#64748b">NW</text>
    <text x="68" y="-30" text-anchor="middle" class="mono" font-size="9" fill="#64748b">NE</text>
    <text x="68" y="38" text-anchor="middle" class="mono" font-size="9" fill="#64748b">SE</text>
    <text x="-68" y="38" text-anchor="middle" class="mono" font-size="9" fill="#64748b">SW</text>

    <!-- Radar Data Polygon -->
    <polygon points="0,-52 48,-18 36,24 0,46 -42,18 -30,-25" fill="url(#statRadarGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#statsGlow)" />
    <!-- Data Points -->
    <circle cx="0" cy="-52" r="3" fill="#00f2fe" />
    <circle cx="48" cy="-18" r="3" fill="#38bdf8" />
    <circle cx="36" cy="24" r="3" fill="#818cf8" />
    <circle cx="0" cy="46" r="3" fill="#c084fc" />
    <circle cx="-42" cy="18" r="3" fill="#00f2fe" />
    <circle cx="-30" cy="-25" r="3" fill="#38bdf8" />
  </g>

  <!-- Divider Line -->
  <line x1="210" y1="30" x2="210" y2="240" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== MIDDLE: METRICS LIST ==================== -->
  <g transform="translate(235, 40)">
    <!-- Header Username -->
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">i-ankit-here</text>
    
    <!-- Metrics Rows -->
    <g transform="translate(0, 22)">
      <text x="0" y="0" class="label-txt">Total Commits</text>
      <text x="120" y="0" class="val-txt" text-anchor="end">30</text>
      <line x1="0" y1="6" x2="125" y2="6" stroke="#1e293b" stroke-width="0.8" />
    </g>

    <g transform="translate(0, 44)">
      <text x="0" y="0" class="label-txt">PRs</text>
      <text x="120" y="0" class="val-txt" text-anchor="end">23</text>
      <line x1="0" y1="6" x2="125" y2="6" stroke="#1e293b" stroke-width="0.8" />
    </g>

    <g transform="translate(0, 66)">
      <text x="0" y="0" class="label-txt">Net Commits</text>
      <text x="120" y="0" class="val-txt" text-anchor="end">22</text>
      <line x1="0" y1="6" x2="125" y2="6" stroke="#1e293b" stroke-width="0.8" />
    </g>

    <g transform="translate(0, 88)">
      <text x="0" y="0" class="label-txt">Mem Stats</text>
      <text x="120" y="0" class="val-txt" text-anchor="end">2</text>
      <line x1="0" y1="6" x2="125" y2="6" stroke="#1e293b" stroke-width="0.8" />
    </g>

    <g transform="translate(0, 110)">
      <text x="0" y="0" class="label-txt">New Repos</text>
      <text x="120" y="0" class="val-txt" text-anchor="end">20</text>
      <line x1="0" y1="6" x2="125" y2="6" stroke="#1e293b" stroke-width="0.8" />
    </g>
  </g>

  <!-- Glowing Starburst Graphic in Middle-Right -->
  <g transform="translate(425, 95)" filter="url(#statsGlow)">
    <polygon points="0,-25 6,-7 25,0 6,7 0,25 -6,7 -25,0 -6,-7" fill="url(#starburstGrad)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <!-- Gradient Trail Rays -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="url(#starburstGrad)" stroke-width="1.5" />
    <line x1="0" y1="-35" x2="0" y2="35" stroke="url(#starburstGrad)" stroke-width="1.5" />
  </g>

  <!-- Divider Line -->
  <line x1="485" y1="30" x2="485" y2="240" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== RIGHT: GAUGES & ACTIVITY BARS ==================== -->
  
  <!-- Circular Gauges -->
  <g transform="translate(510, 45)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Total Commits</text>
    
    <!-- Gauge 1: 28 -->
    <g transform="translate(30, 38)">
      <circle cx="0" cy="0" r="22" fill="#0b172a" stroke="#1e293b" stroke-width="4" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="138" stroke-dashoffset="35" transform="rotate(-90)" filter="url(#statsGlow)" />
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">28</text>
    </g>

    <!-- Gauge 2: 30 -->
    <g transform="translate(95, 38)">
      <circle cx="0" cy="0" r="22" fill="#0b172a" stroke="#1e293b" stroke-width="4" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="138" stroke-dashoffset="15" transform="rotate(-90)" filter="url(#statsGlow)" />
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">30</text>
    </g>
  </g>

  <!-- Activity Bar Equalizer (Monthly / Weekly commit bars) -->
  <g transform="translate(510, 140)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Activity Equalizer</text>
    
    <!-- Equalizer Vertical Bars -->
    <g transform="translate(10, 75) scale(1, -1)">
      <!-- 12 Bars for months -->
      <rect x="0" y="0" width="8" height="28" rx="2" fill="#00f2fe" filter="url(#statsGlow)" />
      <rect x="12" y="0" width="8" height="42" rx="2" fill="#38bdf8" filter="url(#statsGlow)" />
      <rect x="24" y="0" width="8" height="18" rx="2" fill="#0284c7" />
      <rect x="36" y="0" width="8" height="55" rx="2" fill="#00f2fe" filter="url(#statsGlow)" />
      <rect x="48" y="0" width="8" height="35" rx="2" fill="#818cf8" />
      <rect x="60" y="0" width="8" height="62" rx="2" fill="#a855f7" filter="url(#statsGlow)" />
      <rect x="72" y="0" width="8" height="48" rx="2" fill="#c084fc" />
      <rect x="84" y="0" width="8" height="25" rx="2" fill="#38bdf8" />
      <rect x="96" y="0" width="8" height="52" rx="2" fill="#00f2fe" filter="url(#statsGlow)" />
      <rect x="108" y="0" width="8" height="38" rx="2" fill="#a855f7" />
      <rect x="120" y="0" width="8" height="68" rx="2" fill="#38bdf8" filter="url(#statsGlow)" />
      <rect x="132" y="0" width="8" height="45" rx="2" fill="#00f2fe" filter="url(#statsGlow)" />
    </g>

    <!-- Month Tick Labels -->
    <g font-family="'Consolas', monospace" font-size="8" fill="#64748b">
      <text x="14" y="90">J</text>
      <text x="26" y="90">F</text>
      <text x="38" y="90">M</text>
      <text x="50" y="90">A</text>
      <text x="62" y="90">M</text>
      <text x="74" y="90">J</text>
      <text x="86" y="90">J</text>
      <text x="98" y="90">A</text>
      <text x="110" y="90">S</text>
      <text x="122" y="90">O</text>
      <text x="134" y="90">N</text>
      <text x="146" y="90">D</text>
    </g>
  </g>
</svg>
