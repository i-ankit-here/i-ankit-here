<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1224" />
      <stop offset="100%" stop-color="#050913" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Gemini Sparkle Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E88F9" />
      <stop offset="50%" stop-color="#8E75C2" />
      <stop offset="100%" stop-color="#F27398" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes hudPulse {
      0%, 100% { stroke: #00f2fe; filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.6)); }
      50% { stroke: #38bdf8; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9)); }
    }
    .hud-border { animation: hudPulse 4s ease-in-out infinite; }
    .section-title {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .label {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      fill: #cbd5e1;
      text-anchor: middle;
      letter-spacing: 0.3px;
    }
    .badge-sub {
      font-family: 'Segoe UI', sans-serif;
      font-size: 8.5px;
      fill: #64748b;
      text-anchor: middle;
    }
  </style>

  <!-- Cyber HUD Outer Container Frame -->
  <g class="hud-border" filter="url(#hudGlow)">
    <path d="M 25,12 L 855,12 A 12,12 0 0,1 867,24 L 867,546 A 12,12 0 0,1 855,558 L 25,558 A 12,12 0 0,1 13,546 L 13,24 A 12,12 0 0,1 25,12 Z" 
          fill="url(#hudBg)" stroke="#00f2fe" stroke-width="2.2" />

    <!-- Futuristic Tech Corner Accents -->
    <path d="M 8,35 L 8,8 L 35,8" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="8" cy="8" r="2.5" fill="#38bdf8" />
    <path d="M 845,8 L 872,8 L 872,35" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="872" cy="8" r="2.5" fill="#38bdf8" />
    <path d="M 8,535 L 8,562 L 35,562" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="8" cy="562" r="2.5" fill="#38bdf8" />
    <path d="M 845,562 L 872,562 L 872,535" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="872" cy="562" r="2.5" fill="#38bdf8" />
  </g>

  <!-- ==================== FIELD 1: PROGRAMMING LANGUAGES ==================== -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" class="section-title">💻 Programming Languages</text>
    <line x1="220" y1="-4" x2="805" y2="-4" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- 7 Languages (Width: 104, Gap: 12, Start X: 35, Y: 46) -->
  <!-- 1. C++ -->
  <g transform="translate(35, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#00599c" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="52" cy="28" r="16" fill="#00599c" />
    <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">C++</text>
    <text x="52" y="62" class="label">C++</text>
  </g>

  <!-- 2. C -->
  <g transform="translate(151, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#00599c" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="52" cy="28" r="16" fill="#00599c" />
    <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">C</text>
    <text x="52" y="62" class="label">C</text>
  </g>

  <!-- 3. Python -->
  <g transform="translate(267, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <g transform="translate(37, 13) scale(1.3)">
      <path d="M11.9,1.5 C7.5,1.5 7.8,3.4 7.8,3.4 L7.8,5.4 L12,5.4 L12,6 L5,6 C5,6 1.8,5.6 1.8,10.8 C1.8,16 4.6,15.7 4.6,15.7 L6.2,15.7 L6.2,13.5 C6.2,11 8.3,10.8 8.3,10.8 L12.5,10.8 C12.5,10.8 14.4,10.8 14.4,8.9 L14.4,3.4 C14.4,3.4 14.8,1.5 11.9,1.5 Z" fill="#387eb8" />
      <path d="M12.1,22.5 C16.5,22.5 16.2,20.6 16.2,20.6 L16.2,18.6 L12,18.6 L12,18 L19,18 C19,18 22.2,18.4 22.2,13.2 C22.2,8 19.4,8.3 19.4,8.3 L17.8,8.3 L17.8,10.5 C17.8,13 15.7,13.2 15.7,13.2 L11.5,13.2 C11.5,13.2 9.6,13.2 9.6,15.1 L9.6,20.6 C9.6,20.6 9.2,22.5 12.1,22.5 Z" fill="#ffe052" />
    </g>
    <text x="52" y="62" class="label">Python</text>
  </g>

  <!-- 4. JavaScript -->
  <g transform="translate(383, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#f7df1e" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="37" y="14" width="30" height="30" rx="3" fill="#f7df1e" />
    <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">JS</text>
    <text x="52" y="62" class="label">JavaScript</text>
  </g>

  <!-- 5. Java -->
  <g transform="translate(499, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#ed8b00" stroke-width="1.2" stroke-opacity="0.8" />
    <g transform="translate(37, 13)">
      <path d="M11,4 C11,4 9,8 12,11 C15,13 14,16 14,16 C14,16 16,13 13,11 C10,8 11,4 11,4 Z" fill="#e76f00" />
      <path d="M6,18 L24,18 C24,18 25,23 20,25 L10,25 C5,23 6,18 6,18 Z" fill="#5382a1" />
      <path d="M4,27 C4,27 8,29 15,29 C22,29 26,27 26,27 C26,27 23,31 15,31 C7,31 4,27 4,27 Z" fill="#e76f00" />
    </g>
    <text x="52" y="62" class="label">Java</text>
  </g>

  <!-- 6. HTML5 -->
  <g transform="translate(615, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#e34f26" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M38,14 L66,14 L63.5,42 L52,45.5 L40.5,42 Z" fill="#e34f26" />
    <text x="52" y="35" font-family="'Arial Black', sans-serif" font-size="15" fill="#fff" text-anchor="middle">5</text>
    <text x="52" y="62" class="label">HTML5</text>
  </g>

  <!-- 7. CSS3 -->
  <g transform="translate(731, 46)">
    <rect width="104" height="74" rx="8" fill="url(#cardGrad)" stroke="#1572b6" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M38,14 L66,14 L63.5,42 L52,45.5 L40.5,42 Z" fill="#1572b6" />
    <text x="52" y="35" font-family="'Arial Black', sans-serif" font-size="15" fill="#fff" text-anchor="middle">3</text>
    <text x="52" y="62" class="label">CSS3</text>
  </g>

  <!-- ==================== FIELD 2: FRONTEND, BACKEND & DB ==================== -->
  <g transform="translate(35, 155)">
    <text x="0" y="0" class="section-title">⚡ Web Frameworks &amp; Architecture</text>
    <line x1="280" y1="-4" x2="805" y2="-4" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- 5 Cards (Width: 148, Gap: 15, Start X: 35, Y: 170) -->
  <!-- 1. React -->
  <g transform="translate(35, 170)">
    <rect width="148" height="74" rx="8" fill="url(#cardGrad)" stroke="#61dafb" stroke-width="1.2" stroke-opacity="0.8" />
    <g transform="translate(59, 13)">
      <ellipse cx="15" cy="15" rx="15" ry="6" fill="none" stroke="#61dafb" stroke-width="1.6" />
      <ellipse cx="15" cy="15" rx="15" ry="6" fill="none" stroke="#61dafb" stroke-width="1.6" transform="rotate(60, 15, 15)" />
      <ellipse cx="15" cy="15" rx="15" ry="6" fill="none" stroke="#61dafb" stroke-width="1.6" transform="rotate(120, 15, 15)" />
      <circle cx="15" cy="15" r="2.8" fill="#61dafb" />
    </g>
    <text x="74" y="62" class="label">React</text>
  </g>

  <!-- 2. TailwindCSS -->
  <g transform="translate(198, 170)">
    <rect width="148" height="74" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M60,20 C64,16 68,15 72,17 C76,19 79,23 85,23 C90,23 93,20 95,16 C93,19 90,21 86,19 C82,17 79,13 73,13 C68,13 65,16 60,20 Z" fill="#38bdf8" transform="translate(0, 5) scale(1.1)" />
