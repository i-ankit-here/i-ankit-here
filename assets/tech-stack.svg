    <path d="M74,13 L88,21 L88,37 L74,45 L60,37 L60,21 Z" fill="#68a063" />
    <text x="74" y="33" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">JS</text>
    <text x="74" y="62" class="label">Node.js</text>
  </g>

  <!-- 4. Express.js -->
  <g transform="translate(524, 170)">
    <rect width="148" height="74" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="44" y="16" width="60" height="26" rx="5" fill="#14532d" opacity="0.4" stroke="#22c55e" stroke-width="1" />
    <text x="74" y="33" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#4ade80" text-anchor="middle">Express</text>
    <text x="74" y="62" class="label">Express.js</text>
  </g>

  <!-- 5. MongoDB -->
  <g transform="translate(687, 170)">
    <rect width="148" height="74" rx="8" fill="url(#cardGrad)" stroke="#47a248" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M74,12 C72,17 68,19 68,26 C68,33 73,38 74,43 C75,38 80,33 80,26 C80,19 76,17 74,12 Z" fill="#47a248" />
