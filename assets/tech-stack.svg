  </g>

  <!-- ==================== FIELD 3: AI & GENERATIVE TOOLS ==================== -->
  <g transform="translate(35, 278)">
    <text x="0" y="0" class="section-title">🤖 AI &amp; Generative Intelligence</text>
    <line x1="280" y1="-4" x2="805" y2="-4" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- 3 Wide AI Cards (Width: 256, Gap: 18, Start X: 35, Y: 294) -->
