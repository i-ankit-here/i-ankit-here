<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1224" />
      <stop offset="100%" stop-color="#050913" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes hudPulse {
      0%, 100% { stroke: #00f2fe; filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.6)); }
      50% { stroke: #38bdf8; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9)); }
    }
    .hud-border {
      animation: hudPulse 4s ease-in-out infinite;
    }
    .tech-card {
      transition: all 0.3s ease;
    }
    .tech-card:hover {
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.8));
    }
    .label {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #94a3b8;
      text-anchor: middle;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Cyber HUD Outer Container -->
  <g class="hud-border" filter="url(#hudGlow)">
    <!-- Main Outer Chamfered Box -->
    <path d="M 25,12 L 675,12 A 12,12 0 0,1 687,24 L 687,346 A 12,12 0 0,1 675,358 L 25,358 A 12,12 0 0,1 13,346 L 13,24 A 12,12 0 0,1 25,12 Z" 
          fill="url(#hudBg)" stroke="#00f2fe" stroke-width="2.2" />

    <!-- Futuristic Tech Corner Accents -->
    <!-- Top-Left -->
    <path d="M 8,35 L 8,8 L 35,8" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="8" cy="8" r="2.5" fill="#38bdf8" />
    <!-- Top-Right -->
    <path d="M 665,8 L 692,8 L 692,35" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="692" cy="8" r="2.5" fill="#38bdf8" />
    <!-- Bottom-Left -->
    <path d="M 8,335 L 8,362 L 35,362" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="8" cy="362" r="2.5" fill="#38bdf8" />
    <!-- Bottom-Right -->
    <path d="M 665,362 L 692,362 L 692,335" fill="none" stroke="#00f2fe" stroke-width="3" />
    <circle cx="692" cy="362" r="2.5" fill="#38bdf8" />

    <!-- Header Tech Tick Marks -->
    <line x1="280" y1="12" x2="420" y2="12" stroke="#38bdf8" stroke-width="3.5" />
    <line x1="290" y1="358" x2="410" y2="358" stroke="#38bdf8" stroke-width="3.5" />
  </g>

