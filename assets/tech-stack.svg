  <g transform="translate(35, 294)">
    <rect width="256" height="82" rx="10" fill="url(#cardGrad)" stroke="#8E75C2" stroke-width="1.5" />
    <g transform="translate(20, 17)">
      <path d="M24,0 Q24,24 0,24 Q24,24 24,48 Q24,24 48,24 Q24,24 24,0 Z" fill="url(#geminiGrad)" filter="url(#tileGlow)" />
    </g>
    <text x="82" y="38" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Google Gemini</text>
    <text x="82" y="56" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Multimodal AI &amp; Reasoning</text>
  </g>

  <!-- 2. Claude AI -->
  <g transform="translate(309, 294)">
    <rect width="256" height="82" rx="10" fill="url(#cardGrad)" stroke="#CC785C" stroke-width="1.5" />
    <g transform="translate(20, 17)">
      <circle cx="24" cy="24" r="22" fill="#2d1c15" />
      <path d="M19,9 L14,24 L18,24 L20,18 L28,18 L30,24 L34,24 L29,9 Z M22,12 L26,12 L27,15 L21,15 Z" fill="#CC785C" />
      <circle cx="24" cy="24" r="4" fill="#E89578" />
    </g>
    <text x="82" y="38" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Claude</text>
    <text x="82" y="56" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Deep Analysis &amp; Coding</text>
  </g>

  <!-- 3. ChatGPT / OpenAI -->
  <g transform="translate(583, 294)">
    <rect width="256" height="82" rx="10" fill="url(#cardGrad)" stroke="#10A37F" stroke-width="1.5" />
    <g transform="translate(20, 17)">
      <circle cx="24" cy="24" r="22" fill="#0d2b24" />
      <circle cx="24" cy="24" r="14" fill="none" stroke="#10A37F" stroke-width="2.5" />
      <path d="M24,14 L24,34 M14,24 L34,24 M17,17 L31,31 M17,31 L31,17" stroke="#10A37F" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="82" y="38" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">ChatGPT</text>
    <text x="82" y="56" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Advanced Reasoning &amp; Dev</text>
  </g>

  <!-- ==================== FIELD 4: IDES & DEVELOPER TOOLS ==================== -->
